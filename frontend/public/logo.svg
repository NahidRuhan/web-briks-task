<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>

    <!-- Column 1: Backlog / To Do (Deep Indigo) -->
    <linearGradient id="col1Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#4338CA"/>
    </linearGradient>

    <!-- Column 2: In Progress (Vibrant Sky/Cyan) -->
    <linearGradient id="col2Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- Column 3: Done (Emerald / Mint) -->
    <linearGradient id="col3Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Subtle Card Glare -->
    <linearGradient id="cardGlare" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Drop Shadow Filter for Floating Elements -->
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Icon Badge -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle Border Ring -->
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="#334155" stroke-width="3" opacity="0.6"/>

  <!-- Kanban Board Elements Group -->
  <g filter="url(#shadow)">
    <!-- Column 1: "To Do" (Two stacked cards) -->
    <g>
      <!-- Top Card -->
      <rect x="92" y="128" width="88" height="116" rx="18" fill="url(#col1Grad)"/>
      <rect x="92" y="128" width="88" height="116" rx="18" fill="url(#cardGlare)"/>
      <!-- Bottom Card -->
      <rect x="92" y="268" width="88" height="80" rx="18" fill="url(#col1Grad)"/>
      <rect x="92" y="268" width="88" height="80" rx="18" fill="url(#cardGlare)"/>
    </g>

    <!-- Column 2: "In Progress" (Tall active workflow card) -->
    <g>
      <rect x="212" y="128" width="88" height="256" rx="18" fill="url(#col2Grad)"/>
      <rect x="212" y="128" width="88" height="256" rx="18" fill="url(#cardGlare)"/>
    </g>

    <!-- Column 3: "Done" (Single completed milestone card) -->
    <g>
      <rect x="332" y="128" width="88" height="152" rx="18" fill="url(#col3Grad)"/>
      <rect x="332" y="128" width="88" height="152" rx="18" fill="url(#cardGlare)"/>
    </g>
  </g>

  <!-- Minimal Indicator Accents (Board Shelf line) -->
  <rect x="92" y="416" width="328" height="6" rx="3" fill="#334155" opacity="0.8"/>
</svg>
